name: Desplegar a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos que necessita actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un desplegament alhora; no cancel·lem els que ja estan en marxa
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instal·lar dependències
        run: npm ci

      - name: Comprovar tipus i plantilles
        run: npm run check

      - name: Construir el lloc
        run: npm run build
        env:
          # Activa `base: '/creativament'` a astro.config.mjs
          GITHUB_PAGES: 'true'

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
